<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Juice Shop-style Login Practice</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="topbar"><span class="brand">Juice Shop</span><span class="small">CSCE 477 demo</span></div>
    <h1>Login</h1>
    <p class="intro">Simple practice form with client-side and server-side checks.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="off" placeholder="Email address">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" placeholder="At least 8 characters">
      <button type="submit">Log in</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
    <p class="footnote">Course practice only. No accounts or passwords are stored.</p>
  </main>
</body>
</html>
